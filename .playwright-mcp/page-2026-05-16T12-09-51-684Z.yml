    - generic [ref=e126]:
      - heading "Często zadawane pytania" [level=2] [ref=e127]
      - generic [ref=e128]:
        - generic [ref=e129]:
          - heading "Czy to oprogramowanie do składania deklaracji podatkowych?" [level=3] [ref=e130]
          - paragraph [ref=e131]: Nie. PracticeNudge nie składa deklaracji podatkowych ani nie przesyła niczego do HMRC. To narzędzie do śledzenia i przypominania, które działa obok istniejącego oprogramowania.
        - generic [ref=e132]:
          - heading "Czy zastępuje Xero / QuickBooks / FreeAgent?" [level=3] [ref=e133]
          - paragraph [ref=e134]: Nie. PracticeNudge współpracuje z istniejącym oprogramowaniem księgowym. Śledzi gotowość klientów i przypomnienia — oprogramowanie księgowe zajmuje się liczbami.
        - generic [ref=e135]:
          - heading "Czym to się różni od arkusza kalkulacyjnego?" [level=3] [ref=e136]
          - paragraph [ref=e137]: Arkusze kalkulacyjne stają się nieaktualne. PracticeNudge zapewnia śledzenie statusu na żywo, automatyczne przypomnienia i jasny widok bez ręcznych aktualizacji.
        - generic [ref=e138]:
          - heading "Czy moje dane są bezpieczne?" [level=3] [ref=e139]
          - paragraph [ref=e140]: Tak. Wszystkie dane są szyfrowane podczas przesyłania i przechowywania. Przestrzegamy brytyjskich standardów ochrony danych i nigdy nie udostępniamy informacji o klientach.
        - generic [ref=e141]:
          - heading "Dla jakiej wielkości firmy jest to przeznaczone?" [level=3] [ref=e142]
          - paragraph [ref=e143]: PracticeNudge jest stworzony dla jednoosobowych praktyków i małych firm z 20–200 klientami. Jeśli jesteś za mały na narzędzia korporacyjne, ale za zajęty na arkusze kalkulacyjne, to jest dla ciebie.
