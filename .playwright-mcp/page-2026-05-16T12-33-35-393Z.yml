        - heading "Is this tax filing software?" [level=3] [ref=e133]
        - paragraph [ref=e134]: No. PracticeNudge does not file taxes or submit anything to HMRC. It's a tracking and chasing tool that sits alongside your existing software.
      - generic [ref=e135]:
        - heading "Does it replace Xero / QuickBooks / FreeAgent?" [level=3] [ref=e136]
        - paragraph [ref=e137]: No. PracticeNudge works with your existing accounting software. It tracks client readiness and follow-ups — your accounting software handles the numbers.
      - generic [ref=e138]:
        - heading "How is this different from a spreadsheet?" [level=3] [ref=e139]
        - paragraph [ref=e140]: Spreadsheets go stale. PracticeNudge gives you live status tracking, automated reminders, and a clear view without manual updates.
      - generic [ref=e141]:
        - heading "Is my data safe?" [level=3] [ref=e142]
        - paragraph [ref=e143]: Yes. All data is encrypted in transit and at rest. We follow UK data protection standards and never share your client information.
