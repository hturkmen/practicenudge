    - generic:
      - generic:
        - heading [level=2]: Często zadawane pytania
        - generic:
          - generic:
            - heading [level=3]: Czy to oprogramowanie do składania deklaracji podatkowych?
            - paragraph: Nie. PracticeNudge nie składa deklaracji podatkowych ani nie przesyła niczego do HMRC. To narzędzie do śledzenia i przypominania, które działa obok istniejącego oprogramowania.
          - generic:
            - heading [level=3]: Czy zastępuje Xero / QuickBooks / FreeAgent?
            - paragraph: Nie. PracticeNudge współpracuje z istniejącym oprogramowaniem księgowym. Śledzi gotowość klientów i przypomnienia — oprogramowanie księgowe zajmuje się liczbami.
          - generic:
            - heading [level=3]: Czym to się różni od arkusza kalkulacyjnego?
            - paragraph: Arkusze kalkulacyjne stają się nieaktualne. PracticeNudge zapewnia śledzenie statusu na żywo, automatyczne przypomnienia i jasny widok bez ręcznych aktualizacji.
          - generic:
            - heading [level=3]: Czy moje dane są bezpieczne?
            - paragraph: Tak. Wszystkie dane są szyfrowane podczas przesyłania i przechowywania. Przestrzegamy brytyjskich standardów ochrony danych i nigdy nie udostępniamy informacji o klientach.
          - generic:
            - heading [level=3]: Dla jakiej wielkości firmy jest to przeznaczone?
            - paragraph: PracticeNudge jest stworzony dla jednoosobowych praktyków i małych firm z 20–200 klientami. Jeśli jesteś za mały na narzędzia korporacyjne, ale za zajęty na arkusze kalkulacyjne, to jest dla ciebie.
