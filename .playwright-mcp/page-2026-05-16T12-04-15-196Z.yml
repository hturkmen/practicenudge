      - generic:
        - heading [level=2]: Frequently Asked Questions
        - generic:
          - generic:
            - heading [level=3]: Is this tax filing software?
            - paragraph: No. PracticeNudge does not file taxes or submit anything to HMRC. It's a tracking and chasing tool that sits alongside your existing software.
          - generic:
            - heading [level=3]: Does it replace Xero / QuickBooks / FreeAgent?
            - paragraph: No. PracticeNudge works with your existing accounting software. It tracks client readiness and follow-ups — your accounting software handles the numbers.
          - generic:
            - heading [level=3]: How is this different from a spreadsheet?
            - paragraph: Spreadsheets go stale. PracticeNudge gives you live status tracking, automated reminders, and a clear view without manual updates.
          - generic:
            - heading [level=3]: Is my data safe?
            - paragraph: Yes. All data is encrypted in transit and at rest. We follow UK data protection standards and never share your client information.
          - generic:
            - heading [level=3]: What size practice is this for?
            - paragraph: PracticeNudge is built for sole practitioners and small practices with 20–200 clients. If you're too small for enterprise tools but too busy for spreadsheets, this is for you.
