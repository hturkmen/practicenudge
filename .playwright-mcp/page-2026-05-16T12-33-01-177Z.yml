    - generic [ref=e131]:
      - heading "Często zadawane pytania" [level=2] [ref=e132]
      - generic [ref=e133]:
        - generic [ref=e134]:
          - heading "Czy to oprogramowanie do składania deklaracji podatkowych?" [level=3] [ref=e135]
          - paragraph [ref=e136]: Nie. PracticeNudge nie składa deklaracji podatkowych ani nie przesyła niczego do HMRC. To narzędzie do śledzenia i przypominania, które działa obok istniejącego oprogramowania.
        - generic [ref=e137]:
          - heading "Czy zastępuje Xero / QuickBooks / FreeAgent?" [level=3] [ref=e138]
          - paragraph [ref=e139]: Nie. PracticeNudge współpracuje z istniejącym oprogramowaniem księgowym. Śledzi gotowość klientów i przypomnienia — oprogramowanie księgowe zajmuje się liczbami.
        - generic [ref=e140]:
          - heading "Czym to się różni od arkusza kalkulacyjnego?" [level=3] [ref=e141]
          - paragraph [ref=e142]: Arkusze kalkulacyjne stają się nieaktualne. PracticeNudge zapewnia śledzenie statusu na żywo, automatyczne przypomnienia i jasny widok bez ręcznych aktualizacji.
        - generic [ref=e143]:
          - heading "Czy moje dane są bezpieczne?" [level=3] [ref=e144]
          - paragraph [ref=e145]: Tak. Wszystkie dane są szyfrowane podczas przesyłania i przechowywania. Przestrzegamy brytyjskich standardów ochrony danych i nigdy nie udostępniamy informacji o klientach.
        - generic [ref=e146]:
          - heading "Dla jakiej wielkości firmy jest to przeznaczone?" [level=3] [ref=e147]
          - paragraph [ref=e148]: PracticeNudge jest stworzony dla jednoosobowych praktyków i małych firm z 20–200 klientami. Jeśli jesteś za mały na narzędzia korporacyjne, ale za zajęty na arkusze kalkulacyjne, to jest dla ciebie.
